<body>
    <h1>Te de albahaca</h1>
            <figure>
                <img src="/images/Albahaca_dulce.jpg" alt="Un ejemlo de la hoja de albahca">
                <figcaption>
                    <h2>Descripcion:</h2>
                    <p>Infusión aromática tradicional de sabor suave, ideal para tomar caliente después de las comidas o para relajar el estómago.</p>
                </figcaption>
            </figure>
            <h2><strong>Ingredientes:</strong></h2>
            <ul>
                <li>2 hojas de albahaca</li>
                <li>2<sup>1/2</sup> cucharadas de azucar</li>
            </ul>
            <h2><strong>Pasos:</strong></h2>
            <ol>
                <li>Pon a hervir agua en un recipiente</li>
                <li>añade las 2 hojas de albahaca y las 21/2 cucharadas de azúcar</li>
                <li>Deja reposar tapado unos minutos.</li>
                <li>Cuela y toma tibio.</li>
            </ol>
